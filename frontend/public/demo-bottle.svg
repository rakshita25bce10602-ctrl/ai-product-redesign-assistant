<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background subtle grid -->
  <rect width="400" height="500" fill="#090d16" rx="20"/>
  <circle cx="200" cy="250" r="140" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow)">
    <!-- Cap -->
    <rect x="175" y="60" width="50" height="24" rx="4" fill="url(#capGrad)" stroke="#2dd4bf" stroke-width="1.5"/>
    <line x1="180" y1="68" x2="220" y2="68" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="180" y1="74" x2="220" y2="74" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    
    <!-- Neck -->
    <rect x="182" y="84" width="36" height="20" fill="#38bdf8" fill-opacity="0.5" stroke="#7dd3fc" stroke-width="1"/>
    
    <!-- Shoulder -->
    <path d="M 182 104 L 140 160 L 260 160 L 218 104 Z" fill="url(#bottleGrad)" stroke="#7dd3fc" stroke-width="1.5"/>

    <!-- Main Body with Ergonomic Indentations -->
    <path d="M 140 160 
             C 138 210, 148 230, 142 270 
             C 136 310, 142 370, 140 410 
             C 140 425, 155 435, 200 435 
             C 245 435, 260 425, 260 410 
             C 258 370, 264 310, 258 270 
             C 252 230, 262 210, 260 160 Z" 
          fill="url(#bottleGrad)" stroke="#7dd3fc" stroke-width="1.5"/>

    <!-- Internal Liquid Level -->
    <path d="M 142 230 
             C 160 225, 180 235, 200 230 
             C 220 225, 240 232, 258 230 
             C 252 270, 264 310, 258 270 
             C 252 310, 258 370, 257 405 
             C 255 420, 240 430, 200 430 
             C 160 430, 145 420, 143 405 
             C 142 370, 148 310, 142 270 Z" 
          fill="url(#liquidGrad)"/>

    <!-- Ribs / Grip Grooves -->
    <line x1="148" y1="210" x2="252" y2="210" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
    <line x1="145" y1="245" x2="255" y2="245" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
    <line x1="147" y1="280" x2="253" y2="280" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
    <line x1="144" y1="340" x2="256" y2="340" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="144" y1="365" x2="256" y2="365" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Volume graduation markings -->
    <line x1="150" y1="250" x2="162" y2="250" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <text x="168" y="253" fill="#ffffff" font-size="10" font-family="monospace" opacity="0.8">500ml</text>
    
    <line x1="150" y1="300" x2="162" y2="300" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <text x="168" y="303" fill="#ffffff" font-size="10" font-family="monospace" opacity="0.8">350ml</text>

    <line x1="150" y1="350" x2="162" y2="350" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <text x="168" y="353" fill="#ffffff" font-size="10" font-family="monospace" opacity="0.8">200ml</text>

    <!-- Highlight Sheen -->
    <path d="M 148 165 C 146 250, 150 350, 148 410" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Annotations / Badges -->
  <rect x="30" y="30" width="130" height="28" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <text x="42" y="49" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif">DEMO PRODUCT</text>

  <rect x="250" y="445" width="120" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="262" y="464" fill="#34d399" font-size="12" font-weight="bold" font-family="sans-serif">PET PLASTIC</text>
</svg>
